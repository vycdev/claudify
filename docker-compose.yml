services:
  claudify:
    build: .
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=your_discord_bot_token_here
      - REQUIRED_ROLE_ID=your_discord_role_id_here
      - AUTH_ADMIN_USER_IDS=
      - MESSAGES_DIR=/app/messages
      - BOT_EFFORT=
    volumes:
      - messages:/app/messages
      - claude-home:/root

volumes:
  messages:
  claude-home:
